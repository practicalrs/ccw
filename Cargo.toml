[package]
name = "ccw"
version = "0.0.1"
edition = "2024"

[dependencies]
async-recursion = "1.2.0"
chrono = { version = "0.4.45", default-features = false, features = [
    "now",
    "serde"
] }
clap = { version = "4.6.7", default-features = false, features = [
    "derive",
    "env",
    "help",
    "std"
] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "json"
] }
serde = { version = "1.0.229", default-features = false, features = [
    "derive"
] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = [
    "macros",
    "rt-multi-thread"
] }
walkdir = "2.5.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
